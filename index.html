<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro do Sorriso - Gestão Odontológica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦷</text></svg>">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "var(--background)",
              surface: "var(--surface)",
              panel: "var(--panel)",
              border: "var(--border)",
              text: {
                DEFAULT: "var(--text)",
                muted: "var(--text-muted)",
              },
              primary: {
                50: '#f0f7ff',
                100: '#e0effe',
                500: '#0284c7',
                600: '#0284c7',
                700: '#0369a1',
              },
              brand: {
                indigo: "#4f46e5",
                teal: "#0d9488",
                emerald: "#10b981",
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', '-apple-system', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      html {
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      :root {
        --background: #f8fafc;
        --surface: #ffffff;
        --panel: #f1f5f9;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
        --shadow-elevated: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      }
      
      .dark {
        --background: #090d16;
        --surface: #111726;
        --panel: #1a2234;
        --border: #242f47;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --shadow-subtle: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
        --shadow-card: 0 4px 20px 0 rgba(0, 0, 0, 0.35);
        --shadow-elevated: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      }

      body {
        background-color: var(--background);
        color: var(--text);
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        transition: background-color 0.25s ease, color 0.25s ease;
        min-height: 100vh;
      }

      /* Clean Crisp Enterprise Typography */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        letter-spacing: -0.02em;
        font-weight: 700;
      }

      /* Enterprise Card & Panel Styling - No distortion */
      .glass-panel, .glass-sidebar, .liquid-glass {
        background-color: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-card);
        border-radius: 0.875rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      .dark .glass-panel, .dark .glass-sidebar, .dark .liquid-glass {
        background-color: rgba(17, 23, 38, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .glass-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        border-radius: 0.625rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        transition: all 0.15s ease-in-out;
        box-shadow: var(--shadow-subtle);
      }

      .glass-button:hover {
        background: var(--panel);
        border-color: rgba(79, 70, 229, 0.3);
        transform: translateY(-1px);
      }

      .glass-button:active {
        transform: translateY(0);
      }

      .glass-button-primary {
        background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #ffffff;
        box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.35);
      }

      .glass-button-primary:hover {
        background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
        box-shadow: 0 6px 18px 0 rgba(79, 70, 229, 0.45);
        transform: translateY(-1px);
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.5);
      }

      .markdown-body h1 { @apply text-xl font-bold mb-4 mt-6; }
      .markdown-body h2 { @apply text-lg font-bold mb-3 mt-5; }
      .markdown-body h3 { @apply text-base font-bold mb-2 mt-4; }
      .markdown-body p { @apply mb-3 leading-relaxed; }
      .markdown-body ul { @apply list-disc pl-5 mb-3; }
      .markdown-body ol { @apply list-decimal pl-5 mb-3; }
      .markdown-body table { @apply w-full border-collapse mb-4 text-xs; }
      .markdown-body th { @apply bg-slate-100 dark:bg-slate-800 p-2.5 text-left border border-slate-200 dark:border-slate-700 font-semibold; }
      .markdown-body td { @apply p-2.5 border border-slate-200 dark:border-slate-700; }
      .markdown-body strong { @apply font-bold text-indigo-600 dark:text-indigo-400; }
    </style>
  </head>
  <body>
    <!-- Subtle Modern Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none opacity-40 dark:opacity-30">
      <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-[120px]"></div>
      <div class="absolute top-1/3 -right-40 w-96 h-96 bg-teal-500/15 rounded-full blur-[120px]"></div>
      <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-sky-500/20 rounded-full blur-[120px]"></div>
    </div>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
