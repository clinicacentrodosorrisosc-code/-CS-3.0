<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro do Sorriso</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦷</text></svg>">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "var(--background)",
              surface: "var(--surface)",
              panel: "var(--panel)",
              border: "var(--border)",
              text: {
                DEFAULT: "var(--text)",
                muted: "var(--text-muted)",
              },
              primary: "#007AFF", // iOS Blue
              secondary: "#34C759", // iOS Green
              "accent-teal": "#5AC8FA",
              "accent-orange": "#FF9500",
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
              display: ['-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              jakarta: ['-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      html {
        font-size: 14.5px;
      }
      @media (min-width: 1024px) {
        html {
          font-size: 13.5px;
        }
      }
      :root {
        --background: #f2f2f7;
        --surface: rgba(255, 255, 255, 0.15);
        --panel: rgba(255, 255, 255, 0.08);
        --border: rgba(0, 0, 0, 0.08);
        --text: #000000;
        --text-muted: #8e8e93;
      }
      .dark {
        --background: #000000;
        --surface: rgba(28, 28, 30, 0.15);
        --panel: rgba(44, 44, 46, 0.1);
        --border: rgba(255, 255, 255, 0.1);
        --text: #ffffff;
        --text-muted: #ebebf599;
      }
      body {
        background-color: var(--background);
        color: var(--text);
        transition: background-color 0.4s ease, color 0.4s ease;
        min-height: 100vh;
      }

      /* iOS Typography */
      h1, h2, h3, h4, h5, h6, 
      .font-display, 
      .text-xl, .text-2xl, .text-3xl, .text-4xl, .text-5xl {
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      
      /* iOS Liquid Glass / Frosting */
      .glass-panel, .glass-sidebar, .liquid-glass {
        position: relative;
        isolation: isolate;
        border: 1px solid var(--border);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        border-radius: 1.5rem; /* Large continuous curves */
      }
      
      .glass-panel::before, .liquid-glass::before, .glass-filter {
        content: "";
        position: absolute;
        inset: 0;
        backdrop-filter: url(#glass-distortion) blur(60px) saturate(200%);
        -webkit-backdrop-filter: url(#glass-distortion) blur(60px) saturate(200%);
        z-index: -2;
        border-radius: inherit;
        pointer-events: none;
      }
      
      .glass-panel::after, .liquid-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        /* surface + specular gradient */
        background: var(--surface), linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
      }

      .glass-overlay {
        position: absolute;
        inset: 0;
        background: var(--surface);
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
      }

      .glass-specular {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
      }

      .glass-content {
        position: relative;
        z-index: 10;
      }

      .glass-icon {
        position: relative;
        isolation: isolate;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .dark .glass-icon {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      }
      
      .glass-icons-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(48px, 1fr));
        gap: 0.75rem;
      }

      .dark .glass-panel, .dark .glass-sidebar, .dark .liquid-glass {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      /* Buttons */
      .glass-button {
        position: relative;
        isolation: isolate;
        border: 1px solid var(--border);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        border-radius: 1rem;
      }
      .glass-button::before {
        content: "";
        position: absolute;
        inset: 0;
        backdrop-filter: url(#glass-distortion) blur(60px) saturate(200%);
        -webkit-backdrop-filter: url(#glass-distortion) blur(60px) saturate(200%);
        z-index: -2;
        border-radius: inherit;
        pointer-events: none;
      }
      .glass-button::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--panel), linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
        z-index: -1;
        border-radius: inherit;
        pointer-events: none;
      }
      .glass-button:hover {
        transform: scale(0.98);
      }
      .glass-button:hover::after {
        background: var(--surface), linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%);
      }
      .glass-button:active {
        transform: scale(0.95);
        opacity: 0.8;
      }
      
      .glass-button-primary {
        background: #007AFF;
        border: none;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      }
      .glass-button-primary:hover {
        background: #006ae6;
        transform: scale(0.98);
      }

      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .markdown-body h1 { @apply text-xl font-bold mb-4 mt-6; }
      .markdown-body h2 { @apply text-lg font-bold mb-3 mt-5; }
      .markdown-body h3 { @apply text-base font-bold mb-2 mt-4; }
      .markdown-body p { @apply mb-3; }
      .markdown-body ul { @apply list-disc pl-5 mb-3; }
      .markdown-body ol { @apply list-decimal pl-5 mb-3; }
      .markdown-body table { @apply w-full border-collapse mb-4 text-xs; }
      .markdown-body th { @apply bg-black/5 dark:bg-white/5 p-2 text-left border border-black/10 dark:border-white/10; }
      .markdown-body td { @apply p-2 border border-black/10 dark:border-white/10; }
      .markdown-body strong { @apply font-bold; }
    </style>
  </head>
  <body>
    <!-- SVG Filter for Glass Distortion -->
    <svg style="display: none">
      <filter id="glass-distortion">
        <feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="77" />
      </filter>
    </svg>

    <!-- System Premium Background Image Layer -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
      <img 
        src="/src/assets/images/premium_glassmorphism_bg_1784487882929.jpg" 
        alt="Premium System Background" 
        class="w-full h-full object-cover opacity-[0.14] dark:opacity-[0.28] transition-opacity duration-500 blur-[8px] scale-[1.05]"
        referrerpolicy="no-referrer"
      />
      <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-background/50 dark:to-black/50"></div>
    </div>


    
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
