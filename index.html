<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro do Sorriso • Gestão Integrada</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "var(--background)",
              surface: "var(--surface)",
              panel: "var(--panel)",
              border: "var(--border)",
              text: {
                DEFAULT: "var(--text)",
                muted: "var(--text-muted)",
              },
              primary: {
                DEFAULT: "#2563EB",
                hover: "#1D4ED8",
                light: "#3B82F6",
                dim: "#1E40AF",
              },
              success: "#10B981",
              warning: "#F59E0B",
              danger: "#EF4444",
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
              display: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      html {
        font-size: 14px;
      }
      @media (min-width: 1024px) {
        html {
          font-size: 13.5px;
        }
      }
      :root {
        --background: #F8FAFC;
        --surface: rgba(255, 255, 255, 0.85);
        --panel: rgba(241, 245, 249, 0.8);
        --border: rgba(0, 0, 0, 0.08);
        --text: #0F172A;
        --text-muted: #64748B;
      }
      .dark {
        --background: #0B0F17;
        --surface: rgba(17, 24, 39, 0.75);
        --panel: rgba(30, 41, 59, 0.65);
        --border: rgba(255, 255, 255, 0.08);
        --text: #F8FAFC;
        --text-muted: #94A3B8;
      }
      body {
        background-color: var(--background);
        color: var(--text);
        transition: background-color 0.25s ease, color 0.25s ease;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Clean Executive Typography */
      h1, h2, h3, h4, h5, h6, 
      .font-display, 
      .text-xl, .text-2xl, .text-3xl, .text-4xl, .text-5xl {
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      
      /* Refined Lightweight Glass Panels */
      .glass-panel, .glass-sidebar, .liquid-glass {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.25);
        border-radius: 1.25rem;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .dark .glass-panel, .dark .glass-sidebar, .dark .liquid-glass {
        box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.4);
      }
      
      .glass-filter, .glass-overlay, .glass-specular {
        display: none;
      }

      .glass-content {
        position: relative;
        z-index: 1;
      }

      .glass-icon {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.625rem;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* Clean Buttons */
      .glass-button {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        transition: all 0.15s ease;
        border-radius: 0.75rem;
      }
      .glass-button:hover {
        background: var(--surface);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .glass-button:active {
        transform: scale(0.98);
      }
      
      .glass-button-primary {
        background: #2563EB;
        border: 1px solid #3B82F6;
        color: #ffffff;
        box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
      }
      .glass-button-primary:hover {
        background: #1D4ED8;
      }

      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      
      .markdown-body h1 { @apply text-xl font-bold mb-4 mt-6; }
      .markdown-body h2 { @apply text-lg font-bold mb-3 mt-5; }
      .markdown-body h3 { @apply text-base font-bold mb-2 mt-4; }
      .markdown-body p { @apply mb-3; }
      .markdown-body ul { @apply list-disc pl-5 mb-3; }
      .markdown-body ol { @apply list-decimal pl-5 mb-3; }
      .markdown-body table { @apply w-full border-collapse mb-4 text-xs; }
      .markdown-body th { @apply bg-black/5 dark:bg-white/5 p-2 text-left border border-black/10 dark:border-white/10 font-semibold; }
      .markdown-body td { @apply p-2 border border-black/10 dark:border-white/10; }
      .markdown-body strong { @apply font-bold; }
    </style>
  </head>
  <body>
    <!-- Subtle Ambient Lighting Canvas Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none opacity-40 dark:opacity-25">
      <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-blue-600/10 blur-[120px]"></div>
      <div class="absolute bottom-[-10%] right-[-10%] w-[45vw] h-[45vw] rounded-full bg-indigo-600/10 blur-[140px]"></div>
    </div>
    
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
