<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centro do Sorriso • Gestão Integrada</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="build-time" content="2026-09-04T14:54:00" />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Material Icons & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: "var(--bg)",
              surface: "var(--surface)",
              panel: "var(--surface-high)",
              border: "var(--border)",
              text: {
                DEFAULT: "var(--text)",
                muted: "var(--text-muted)",
              },
              primary: {
                DEFAULT: "#0EA5E9",
                hover: "#0284C7",
                light: "#38BDF8",
                dim: "rgba(14, 165, 233, 0.12)",
              },
              success: "#10B981",
              warning: "#F59E0B",
              danger: "#EF4444",
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- Tailwind must load after its configuration so `dark:` follows the
         application's .dark class instead of only the OS color scheme. -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-background text-text antialiased selection:bg-sky-500/20 selection:text-sky-300">
    <!-- Subtle Ambient Lighting Canvas Background -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none opacity-30 dark:opacity-20">
      <div class="absolute top-[-15%] left-[-10%] w-[55vw] h-[55vw] rounded-full bg-sky-600/10 blur-[140px]"></div>
      <div class="absolute bottom-[-15%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-indigo-600/10 blur-[160px]"></div>
    </div>
    
    <div id="root" class="relative z-10"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
